<script>
  function openDB(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('satsflow',1);
      r.onupgradeneeded=e=>{const db=e.target.result;
        if(!db.objectStoreNames.contains('alerts'))db.createObjectStore('alerts',{keyPath:'id'});
        if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});};
      r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);
    });
  }
  window.dbHelpers={
    async saveAlerts(a){try{const db=await openDB();const tx=db.transaction('alerts','readwrite');const s=tx.objectStore('alerts');s.clear();for(const x of a)s.put(x);return new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j;});}catch(e){console.warn(e);}},
    async loadAlerts(){try{const db=await openDB();const tx=db.transaction('alerts','readonly');return new Promise(r=>{const q=tx.objectStore('alerts').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}catch{return[];}}
  };
  if('serviceWorker' in navigator){
    window.addEventListener('load',async()=>{
      try{
        const reg=await navigator.serviceWorker.register('/sw.js');
        if('periodicSync' in reg){try{const p=await navigator.permissions.query({name:'periodic-background-sync'});if(p.state==='granted')await reg.periodicSync.register('price-check',{minInterval:15*60*1000});}catch{}}
      }catch(e){console.warn('[PWA]',e.message);}
    });
  }
</script>

/* ══════════════════════════════════════════════════════════
   TECHNICAL ANALYSIS ENGINE
══════════════════════════════════════════════════════════ */
const calcSMA=(prices,period)=>{
  return prices.map((_,i)=>{
    if(i<period-1)return null;
    const slice=prices.slice(i-period+1,i+1);
    return slice.reduce((a,b)=>a+b,0)/period;
  });
};

const calcEMA=(prices,period)=>{
  const k=2/(period+1);
  const ema=[];
  prices.forEach((p,i)=>{
    if(i===0){ema.push(p);return;}
    ema.push(p*k+ema[i-1]*(1-k));
  });
  return ema;
};

const calcRSI=(prices,period=14)=>{
  const rsi=new Array(period).fill(null);
  let gains=0,losses=0;
  for(let i=1;i<=period;i++){
    const diff=prices[i]-prices[i-1];
    if(diff>0)gains+=diff;else losses+=Math.abs(diff);
  }
  let avgGain=gains/period,avgLoss=losses/period;
  for(let i=period;i<prices.length;i++){
    const diff=prices[i]-prices[i-1];
    avgGain=(avgGain*(period-1)+(diff>0?diff:0))/period;
    avgLoss=(avgLoss*(period-1)+(diff<0?Math.abs(diff):0))/period;
    const rs=avgLoss===0?100:avgGain/avgLoss;
    rsi.push(100-(100/(1+rs)));
  }
  return rsi;
};

const calcMACD=(prices)=>{
  const ema12=calcEMA(prices,12);
  const ema26=calcEMA(prices,26);
  const macdLine=ema12.map((v,i)=>v-ema26[i]);
  const signal=calcEMA(macdLine.slice(26),9);
  const paddedSignal=new Array(26).fill(null).concat(new Array(macdLine.length-26-signal.length).fill(null)).concat(signal);
  const histogram=macdLine.map((v,i)=>paddedSignal[i]!=null?v-paddedSignal[i]:null);
  return{macdLine,signal:paddedSignal,histogram};
};

const calcBollingerBands=(prices,period=20,multiplier=2)=>{
  const sma=calcSMA(prices,period);
  return prices.map((_,i)=>{
    if(sma[i]===null)return{upper:null,middle:null,lower:null};
    const slice=prices.slice(Math.max(0,i-period+1),i+1);
    const mean=sma[i];
    const std=Math.sqrt(slice.reduce((a,b)=>a+(b-mean)**2,0)/slice.length);
    return{upper:mean+multiplier*std,middle:mean,lower:mean-multiplier*std};
  });
};

const analyzeMarket=(prices)=>{
  if(prices.length<30)return null;
  const last=prices[prices.length-1];
  const rsi=calcRSI(prices);
  const lastRSI=rsi[rsi.length-1];
  const sma7=calcSMA(prices,7);
  const sma30=calcSMA(prices,Math.min(30,prices.length));
  const lastSMA7=sma7[sma7.length-1];
  const lastSMA30=sma30[sma30.length-1];
  const{macdLine,signal,histogram}=calcMACD(prices);
  const lastMACD=macdLine[macdLine.length-1];
  const lastSignal=signal[signal.length-1];
  const lastHist=histogram[histogram.length-1];
  const bb=calcBollingerBands(prices);
  const lastBB=bb[bb.length-1];

  // Support & Resistance (simplified: recent highs/lows)
  const recent=prices.slice(-30);
  const support=Math.min(...recent)*0.98;
  const resistance=Math.max(...recent)*1.02;

  // Score system
  let bullScore=0,bearScore=0;
  if(lastRSI<30){bullScore+=3;}else if(lastRSI<45){bullScore+=1;}
  else if(lastRSI>70){bearScore+=3;}else if(lastRSI>55){bearScore+=1;}
  if(lastSMA7>lastSMA30)bullScore+=2;else bearScore+=2;
  if(lastMACD>lastSignal)bullScore+=2;else bearScore+=2;
  if(lastHist>0&&lastHist>histogram[histogram.length-2])bullScore+=1;
  else if(lastHist<0&&lastHist<histogram[histogram.length-2])bearScore+=1;
  if(lastBB.lower&&last<lastBB.lower)bullScore+=2;
  else if(lastBB.upper&&last>lastBB.upper)bearScore+=2;

  const total=bullScore+bearScore;
  const bullPct=total>0?Math.round((bullScore/total)*100):50;

  let signal2,signalColor,signalIcon;
  if(bullPct>=65){signal2='COMPRAR';signalColor='emerald';signalIcon='↑';}
  else if(bullPct<=35){signal2='VENDER';signalColor='red';signalIcon='↓';}
  else{signal2='NEUTRAL';signalColor='yellow';signalIcon='→';}

  return{
    rsi:lastRSI?.toFixed(1),sma7:lastSMA7,sma30:lastSMA30,
    macd:lastMACD?.toFixed(1),macdSignal:lastSignal?.toFixed(1),
    bbUpper:lastBB.upper,bbLower:lastBB.lower,bbMiddle:lastBB.middle,
    support,resistance,bullPct,bearPct:100-bullPct,
    signal:signal2,signalColor,signalIcon,
    rsiData:rsi.slice(-50).map((v,i)=>({i,rsi:v})),
    macdData:macdLine.slice(-50).map((v,i)=>({i,macd:v,signal:signal[signal.length-50+i],hist:histogram[histogram.length-50+i]})),
  };
};

const Converter=({btcPriceUsd,btcPriceEur})=>{
  const{dark}=useTheme();
  const[btc,setBtc]=useState('1');
  const[sats,setSats]=useState('100000000');
  const[usd,setUsd]=useState('');
  const[eur,setEur]=useState('');
  useEffect(()=>{if(btcPriceUsd>0&&btc)calc('btc',btc,btcPriceUsd,btcPriceEur);},[btcPriceUsd,btcPriceEur]);
  function calc(f,raw,pU=btcPriceUsd,pE=btcPriceEur){
    const v=parseFloat(raw),ok=!isNaN(v)&&v>=0;
    if(f==='btc'){setBtc(raw);ok?(setSats((v*1e8).toFixed(0)),setUsd((v*pU).toFixed(2)),setEur((v*pE).toFixed(2))):(setSats(''),setUsd(''),setEur(''));}
    if(f==='sats'){setSats(raw);if(ok){const b=v/1e8;setBtc(b.toFixed(8).replace(/\.?0+$/,''));setUsd((b*pU).toFixed(2));setEur((b*pE).toFixed(2));}else{setBtc('');setUsd('');setEur('');}}
    if(f==='usd'){setUsd(raw);if(ok&&pU){const b=v/pU;setBtc(b.toFixed(8));setSats((b*1e8).toFixed(0));setEur((b*pE).toFixed(2));}else{setBtc('');setSats('');setEur('');}}
    if(f==='eur'){setEur(raw);if(ok&&pE){const b=v/pE;setBtc(b.toFixed(8));setSats((b*1e8).toFixed(0));setUsd((b*pU).toFixed(2));}else{setBtc('');setSats('');setUsd('');}}
  }
  const inputClass=`w-full rounded-lg p-2.5 pl-8 border outline-none transition-all text-sm ${dark?'bg-slate-900 text-white border-slate-700':'bg-gray-50 text-slate-900 border-gray-200 focus:border-orange-400'}`;
  const fields=[{id:'btc',label:'Bitcoin (BTC)',icon:'₿',color:'text-orange-500',border:'focus:border-orange-500',val:btc},{id:'sats',label:'Satoshis',icon:'⚡',color:'text-yellow-500',border:'focus:border-yellow-500',val:sats},{id:'usd',label:'Dólar (USD)',icon:'$',color:'text-green-500',border:'focus:border-green-500',val:usd},{id:'eur',label:'Euro (EUR)',icon:'€',color:'text-blue-500',border:'focus:border-blue-500',val:eur}];
  return(<Card>
    <h2 className="text-lg font-semibold flex items-center gap-2 mb-4"><ArrowRightLeft className="w-5 h-5 text-orange-500"/>Conversor</h2>

const CandleChart=({data,dark})=>{
  if(!data.length)return null;
  const prices=data.flatMap(d=>[d.high,d.low]),minP=Math.min(...prices),maxP=Math.max(...prices),range=maxP-minP||1;
  const W=600,H=220,PAD=8,LEFT=50,BOT=24;
  const cW=Math.max(3,Math.floor((W-LEFT-PAD)/data.length)-2);
  const toY=v=>PAD+(1-(v-minP)/range)*(H-PAD-BOT);
  const toX=i=>LEFT+(i+0.5)*((W-LEFT-PAD)/data.length);
  const step=Math.ceil(data.length/6);
  const gridColor=dark?'#334155':'#e2e8f0';
  const labelColor=dark?'#94a3b8':'#64748b';
  return(<div className="w-full overflow-x-auto">
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{minWidth:'280px'}}>
      {[0,0.25,0.5,0.75,1].map(t=>{const y=PAD+t*(H-PAD-BOT);const val=maxP-t*range;return(<g key={t}>
        <line x1={LEFT} y1={y} x2={W-PAD} y2={y} stroke={gridColor} strokeDasharray="3 3"/>
        <text x={LEFT-4} y={y+4} textAnchor="end" fill={labelColor} fontSize="9">${(val/1000).toFixed(0)}k</text>
      </g>);})}
      {data.map((d,i)=>{const up=d.close>=d.open,x=toX(i),yH=toY(d.high),yL=toY(d.low),yO=toY(d.open),yC=toY(d.close),bodyTop=Math.min(yO,yC),bodyH=Math.max(1,Math.abs(yO-yC));
        return(<g key={d.ts} className={up?'candle-up':'candle-down'}>
          <line x1={x} y1={yH} x2={x} y2={yL} strokeWidth="1" className="wick"/>
          <rect x={x-cW/2} y={bodyTop} width={cW} height={bodyH} rx="1"/>
          {i%step===0&&<text x={x} y={H-4} textAnchor="middle" fill={labelColor} fontSize="8">{d.date}</text>}
        </g>);})}
    </svg>
  </div>);
};

const FearGreedGauge=({value})=>{
  const color=value<=25?'#ef4444':value<=45?'#f97316':value<=55?'#eab308':value<=75?'#84cc16':'#10b981';
  const labelEs=value<=25?'Miedo extremo':value<=45?'Miedo':value<=55?'Neutral':value<=75?'Codicia':'Codicia extrema';
  const toRad=deg=>(deg*Math.PI)/180;
  const r=70,cx=90,cy=90,angle=-90+(value/100)*180;
  const x=cx+r*Math.cos(toRad(angle)),y=cy+r*Math.sin(toRad(angle));
  const segs=[{c:'#ef4444',s:-90,e:-54},{c:'#f97316',s:-54,e:-18},{c:'#eab308',s:-18,e:18},{c:'#84cc16',s:18,e:54},{c:'#10b981',s:54,e:90}];
  const arc=(s,e)=>{const x1=cx+r*Math.cos(toRad(s)),y1=cy+r*Math.sin(toRad(s)),x2=cx+r*Math.cos(toRad(e)),y2=cy+r*Math.sin(toRad(e));return`M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`;};
  return(<div className="flex flex-col items-center">
    <svg viewBox="0 0 180 100" className="w-full max-w-[180px]">
      {segs.map((s,i)=><path key={i} d={arc(s.s,s.e)} stroke={s.c} strokeWidth="14" fill="none" strokeLinecap="round" opacity="0.4"/>)}
      <line x1={cx} y1={cy} x2={x} y2={y} stroke={color} strokeWidth="3" strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r="4" fill={color}/>
      <text x={cx} y={cy-16} textAnchor="middle" fill="currentColor" fontSize="20" fontWeight="800">{value}</text>
      <text x={cx} y={cy-4} textAnchor="middle" fill={color} fontSize="9" fontWeight="600">{labelEs}</text>
    </svg>
  </div>);
};

    <div className="mb-4">

      <div className={`flex justify-between text-[10px] mt-1 ${dark?'text-slate-600':'text-gray-400'}`}><span>{mempool.txCount.toLocaleString()} tx</span><span>{mempool.vsize} MB</span></div>

    <div className="grid grid-cols-4 gap-1.5 mb-4">

        <div><label className={`block text-[10px] mb-1 ${dark?'text-slate-400':'text-gray-500'}`}>Prioridad</label>
          <select value={feeLevel} onChange={e=>setFeeLevel(e.target.value)} className={inputClass}>
            <option value="fastest">⚡ Rápido</option><option value="halfHour">🟠 30 min</option>

      <div className="grid grid-cols-3 gap-1.5 text-center">
        {[{l:'sat/vB',v:selRate,c:'text-yellow-500'},{l:'Sats',v:totSats.toLocaleString(),c:'text-orange-500'},{l:'USD',v:`$${totUsd}`,c:'text-green-500'}].map(({l,v,c})=>(<div key={l} className={`rounded-lg p-1.5 ${dark?'bg-slate-800':'bg-white border border-gray-200'}`}><p className={`text-[9px] ${dark?'text-slate-500':'text-gray-400'}`}>{l}</p><p className={`text-sm font-bold font-mono ${c}`}>{v}</p></div>))}

/* ══════════════════════════════════════════════════════════
   ATM MAP
══════════════════════════════════════════════════════════ */
const ATMMap=()=>{
  const{dark}=useTheme();
  const mapRef=useRef(null);
  const leafletMap=useRef(null);
  const[status,setStatus]=useState('idle');
  const[atmCount,setAtmCount]=useState(0);
  const[error,setError]=useState('');

  const loadMap=useCallback(async()=>{
    setStatus('locating');setError('');
    try{
      const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000}));
      const{latitude:lat,longitude:lng}=pos.coords;
      setStatus('loading');
      if(!leafletMap.current&&mapRef.current){
        leafletMap.current=L.map(mapRef.current).setView([lat,lng],13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(leafletMap.current);
      }else if(leafletMap.current){
        leafletMap.current.setView([lat,lng],13);
      }
      // User marker
      const userIcon=L.divIcon({html:`<div style="background:#f97316;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>`,iconSize:[16,16],iconAnchor:[8,8],className:''});
      L.marker([lat,lng],{icon:userIcon}).addTo(leafletMap.current).bindPopup('<b>📍 Tu ubicación</b>');
      const atms=await fetchATMs(lat,lng);
      setAtmCount(atms.length);
      const atmIcon=L.divIcon({html:`<div style="background:#f59e0b;width:14px;height:14px;border-radius:3px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:8px">₿</div>`,iconSize:[14,14],iconAnchor:[7,7],className:''});
      atms.forEach(a=>{
        if(leafletMap.current)L.marker([a.lat,a.lng],{icon:atmIcon}).addTo(leafletMap.current).bindPopup(`<b>${a.name}</b><br/><span style="font-size:11px;color:#94a3b8">${a.operator||a.type}${a.address?'<br/>'+a.address:''}</span>`);
      });
      setStatus('done');
    }catch(e){
      setError(e.code===1?'Permiso de ubicación denegado. Actívalo en los ajustes del navegador.':e.message||'Error al cargar el mapa.');
      setStatus('error');
    }
  },[]);

  useEffect(()=>{return()=>{if(leafletMap.current){leafletMap.current.remove();leafletMap.current=null;}};},[]);

  return(<Card>
    <div className="flex items-center justify-between mb-4">
      <h2 className="text-lg font-semibold flex items-center gap-2"><MapPin className="w-5 h-5 text-orange-500"/>Cajeros Bitcoin</h2>
      {status==='done'&&(<span className="text-xs text-emerald-500 font-medium">{atmCount} encontrados</span>)}
    </div>
    {status==='idle'&&(<div className="flex flex-col items-center py-8 gap-4">
      <div className={`w-16 h-16 rounded-full flex items-center justify-center ${dark?'bg-slate-700':'bg-gray-100'}`}><MapPin className="w-8 h-8 text-orange-500"/></div>
      <div className="text-center">
        <p className="font-medium mb-1">Encuentra cajeros Bitcoin cercanos</p>
        <p className={`text-sm ${dark?'text-slate-400':'text-gray-500'}`}>Usaremos tu ubicación para buscar en un radio de ~50 km</p>
      </div>
      <button onClick={loadMap} className="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2.5 rounded-xl font-medium transition-colors flex items-center gap-2">
        <Navigation className="w-4 h-4"/>Buscar cerca de mí
      </button>
    </div>)}
    {(status==='locating'||status==='loading')&&(<div className="flex flex-col items-center py-8 gap-3">
      <RefreshCw className="w-8 h-8 text-orange-500 animate-spin"/>
      <p className={`text-sm ${dark?'text-slate-400':'text-gray-500'}`}>{status==='locating'?'Obteniendo tu ubicación...':'Buscando cajeros Bitcoin...'}</p>
    </div>)}
    {status==='error'&&(<div className="flex flex-col items-center py-6 gap-4">
      <p className="text-red-500 text-sm text-center">{error}</p>
      <button onClick={loadMap} className={`px-4 py-2 rounded-xl text-sm font-medium transition-colors ${dark?'bg-slate-700 hover:bg-slate-600':'bg-gray-100 hover:bg-gray-200'}`}>Reintentar</button>
    </div>)}
    <div ref={mapRef} className={`rounded-xl overflow-hidden transition-all ${status==='done'?'h-[380px]':'h-0'}`} style={{zIndex:1}}/>
    {status==='done'&&(<>
      <p className={`text-[10px] mt-2 text-center ${dark?'text-slate-600':'text-gray-400'}`}>🟠 Cajeros/comercios Bitcoin · 🟠 Tu ubicación · Datos: BTCMap.org</p>
      <button onClick={loadMap} className={`mt-2 w-full py-1.5 rounded-lg text-xs font-medium transition-colors ${dark?'bg-slate-700 hover:bg-slate-600 text-slate-300':'bg-gray-100 hover:bg-gray-200 text-gray-600'}`}>🔄 Actualizar</button>
    </>)}
  </Card>);
};

/* ══════════════════════════════════════════════════════════
   ALERTS
══════════════════════════════════════════════════════════ */
const AlertsPanel=({currentPriceUsd,currentPriceEur})=>{
  const{dark}=useTheme();
  const[alerts,setAlerts]=useState([]);
  const[target,setTarget]=useState('');
  const[currency,setCurrency]=useState('usd');
  const[notifPerm,setNotifPerm]=useState('default');
  const[notifMsg,setNotifMsg]=useState('');
  useEffect(()=>{window.dbHelpers?.loadAlerts().then(s=>{if(s.length)setAlerts(s);});setNotifPerm(window.Notification?.permission||'unsupported');},[]);
  useEffect(()=>{if(!alerts.length)return;window.dbHelpers?.saveAlerts(alerts);navigator.serviceWorker?.ready.then(reg=>reg.active?.postMessage({type:'CHECK_ALERTS',alerts}));},[alerts]);
  useEffect(()=>{if(!currentPriceUsd)return;let changed=false;const updated=alerts.map(a=>{if(a.triggered)return a;const p=a.currency==='usd'?currentPriceUsd:currentPriceEur;const hit=a.condition==='above'?p>=a.targetPrice:p<=a.targetPrice;if(hit){const sym=a.currency==='usd'?'$':'€';showNotif('⚡ Alerta SatsFlow',`BTC ha ${a.condition==='above'?'subido sobre':'bajado de'} ${sym}${a.targetPrice.toLocaleString()}`);changed=true;return{...a,triggered:true};}return a;});if(changed)setAlerts(updated);},[currentPriceUsd,currentPriceEur]);
  const activateNotifs=async()=>{const r=await(window.Notification?Notification.requestPermission():Promise.resolve('unsupported'));setNotifPerm(r);setNotifMsg(r==='granted'?'✅ Activadas':r==='denied'?'❌ Denegado. Actívalas en Ajustes.':'');};
  const addAlert=()=>{const val=parseFloat(target);if(isNaN(val)||val<=0)return;const price=currency==='usd'?currentPriceUsd:currentPriceEur;setAlerts(prev=>[...prev,{id:Date.now().toString(),targetPrice:val,currency,condition:val>price?'above':'below',triggered:false}]);setTarget('');};
  const inputClass=`bg-slate-900 text-white rounded-lg py-2 pl-6 pr-2 border border-slate-700 focus:border-orange-500 outline-none text-sm w-full`;
  return(<Card>
    <h2 className="text-lg font-semibold flex items-center gap-2 mb-4"><Bell className="w-5 h-5 text-orange-500"/>Alertas de precio</h2>
    {'Notification' in window&&notifPerm!=='granted'&&(<div className="mb-4 bg-orange-500/10 border border-orange-500/30 rounded-xl p-3 flex items-start gap-3">
      <Bell className="w-4 h-4 text-orange-400 mt-0.5 flex-shrink-0"/>
      <div className="flex-1"><p className="text-xs text-orange-300 font-medium">Activa las notificaciones</p>{notifMsg&&<p className="text-xs mt-1">{notifMsg}</p>}</div>
      <button onClick={activateNotifs} className="bg-orange-500 hover:bg-orange-600 text-white text-xs px-3 py-1.5 rounded-lg flex-shrink-0">Activar</button>
    </div>)}
    {notifPerm==='granted'&&(<div className="mb-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 flex items-center gap-2"><CheckCircle className="w-4 h-4 text-emerald-400 flex-shrink-0"/><p className="text-xs text-emerald-300">Notificaciones activas con app cerrada.</p></div>)}
    <div className="flex gap-2 mb-4">
      <div className="relative flex-1"><span className={`absolute left-2.5 top-2.5 text-sm ${dark?'text-slate-500':'text-gray-400'}`}>{currency==='usd'?'$':'€'}</span>
        <input type="number" value={target} onChange={e=>setTarget(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addAlert()} className={inputClass} placeholder="Precio objetivo"/>
      </div>
      <select value={currency} onChange={e=>setCurrency(e.target.value)} className={`${dark?'bg-slate-900 text-white border-slate-700':'bg-gray-50 text-slate-900 border-gray-200'} rounded-lg px-2 border outline-none text-sm`}>
        <option value="usd">USD</option><option value="eur">EUR</option>
      </select>
      <button onClick={addAlert} className="bg-orange-500 hover:bg-orange-600 text-white p-2 rounded-lg transition-colors flex-shrink-0"><BellPlus className="w-5 h-5"/></button>
    </div>
    <div className="space-y-2 overflow-y-auto max-h-80">
      {alerts.length===0?(<p className={`text-center text-sm py-8 ${dark?'text-slate-500':'text-gray-400'}`}>Sin alertas activas.<br/>Introduce un precio y pulsa +.</p>):alerts.map(a=>(
        <div key={a.id} className={`flex items-center justify-between p-3 rounded-xl border ${a.triggered?'bg-yellow-500/10 border-yellow-500/40':dark?'bg-slate-700/40 border-slate-600/60':'bg-gray-50 border-gray-200'}`}>
          <div className="flex items-center gap-3">
            {a.triggered?<AlertTriangle className="w-5 h-5 text-yellow-500 animate-pulse flex-shrink-0"/>:<div className={`w-2 h-2 rounded-full flex-shrink-0 ${a.condition==='above'?'bg-green-500':'bg-red-500'}`}/>}
            <div><p className="text-sm font-medium">{a.condition==='above'?'↑':'↓'} {a.currency==='usd'?'$':'€'}{a.targetPrice.toLocaleString()}</p>
              <p className={`text-xs ${dark?'text-slate-400':'text-gray-500'}`}>{a.triggered?'¡DISPARADA!':'Pendiente'}</p></div>
          </div>
          <button onClick={()=>setAlerts(prev=>prev.filter(x=>x.id!==a.id))} className={`p-1 ${dark?'text-slate-500 hover:text-red-400':'text-gray-400 hover:text-red-500'}`}><Trash2 className="w-4 h-4"/></button>
        </div>
      ))}
    </div>
  </Card>);
};

/* ══════════════════════════════════════════════════════════

const TABS=[
  {id:'home',   label:'Inicio',   icon:Home},

  const loadMarket=useCallback(async()=>{setLMkt(true);const[md,mi]=await Promise.all([fetchMarketData(),fetchMiningData()]);setMarketData(md);setMiningData(mi);setLMkt(false);},[]);
  const loadNews=useCallback(async()=>{setLNews(true);setNews(await fetchNews());setLNews(false);},[]);

  useEffect(()=>{

    const pi=setInterval(()=>loadPrice(days),60000);

    const mki=setInterval(loadMarket,120000);

  const navBorder=dark?'border-slate-800':'border-gray-200';
  const activeTab=dark?'text-orange-500':'text-orange-500';
  const inactiveTab=dark?'text-slate-500 hover:text-slate-300':'text-gray-400 hover:text-gray-600';

  return(<ThemeCtx.Provider value={{dark,toggle:toggleTheme}}>
    <div className={`min-h-screen flex flex-col ${dark?'bg-slate-950':'bg-gray-50'}`}>
      {/* Header */}

            <div className="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center shadow-md shadow-orange-500/30">
              <Bitcoin className="w-5 h-5 text-white"/>
            </div>
            <div>
              <h1 className="text-lg font-bold leading-none">SatsFlow</h1>
              <p className={`text-[10px] ${dark?'text-slate-500':'text-gray-400'}`}>Bitcoin Tracker</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="text-right mr-1">
              <p className="text-base font-mono font-bold">${data.current_price.usd.toLocaleString()}</p>
              {ch!==0&&<p className={`text-xs flex items-center justify-end gap-0.5 ${pos?'text-emerald-500':'text-red-500'}`}>{pos?<ChevronUp className="w-3 h-3"/>:<ChevronDown className="w-3 h-3"/>}{Math.abs(ch).toFixed(2)}%</p>}
            </div>
            {/* Dark/Light toggle */}
            <button onClick={toggleTheme} className={`p-2 rounded-lg border transition-colors ${dark?'bg-slate-800 border-slate-700 text-yellow-400 hover:bg-slate-700':'bg-gray-100 border-gray-200 text-slate-600 hover:bg-gray-200'}`} title={dark?'Modo claro':'Modo oscuro'}>
              {dark?<Sun className="w-4 h-4"/>:<Moon className="w-4 h-4"/>}
            </button>
            <InstallPrompt/>
          </div>
        </div>
      </header>

      {/* Content */}
      <main className="flex-1 px-4 py-5 pb-24 overflow-y-auto">
        <div className="max-w-5xl mx-auto">
          {tab==='home'&&(<div className="space-y-5 animate-fadeIn">
            <Converter btcPriceUsd={data.current_price.usd} btcPriceEur={data.current_price.eur}/>
            <PriceChart data={data.history} ohlc={ohlc} selectedDays={days} onDaysChange={d=>{setDays(d);loadPrice(d);}} loading={lChart}/>
            <div className="grid grid-cols-3 gap-3">
              {[{label:'Cap. mercado',val:fmtBig(data.marketCap),color:'text-blue-500'},{label:'Cambio 24h',val:`${pos?'+':''}${ch.toFixed(2)}%`,color:pos?'text-emerald-500':'text-red-500'},{label:'Actualizado',val:lastUpd?lastUpd.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—',color:dark?'text-slate-400':'text-gray-500'}].map(({label,val,color})=>(<div key={label} className={`rounded-xl p-3 border text-center ${dark?'bg-slate-800 border-slate-700':'bg-white border-gray-200 shadow-sm'}`}>
                <p className={`text-[10px] uppercase tracking-wide ${dark?'text-slate-500':'text-gray-400'}`}>{label}</p>
                <p className={`text-sm font-bold mt-0.5 ${color}`}>{val}</p>
              </div>))}
            </div>
          </div>)}
          {tab==='analysis'&&(<div className="animate-fadeIn"><TechnicalPanel history={data.history}/></div>)}
          {tab==='market'&&(<div className="animate-fadeIn"><MarketPanel marketData={marketData} miningData={miningData} loading={lMarket}/></div>)}
          {tab==='mempool'&&(<div className="animate-fadeIn"><MempoolPanel btcPriceUsd={data.current_price.usd} mempoolData={mempool} loading={lMem} onRefresh={loadMempool}/></div>)}
          {tab==='atm'&&(<div className="animate-fadeIn"><ATMMap/></div>)}
          {tab==='news'&&(<div className="animate-fadeIn"><NewsPanel news={news} loading={lNews} onRefresh={loadNews}/></div>)}
          {tab==='alerts'&&(<div className="animate-fadeIn"><AlertsPanel currentPriceUsd={data.current_price.usd} currentPriceEur={data.current_price.eur}/></div>)}
        </div>
      </main>

      {/* Tab Bar */}
      <nav className={`fixed bottom-0 left-0 right-0 z-30 ${navBg} backdrop-blur border-t ${navBorder}`}>
        <div className="max-w-5xl mx-auto flex overflow-x-auto">
          {TABS.map(({id,label,icon:Icon})=>{
            const active=tab===id;
            return(<button key={id} onClick={()=>setTab(id)} className={`flex-1 flex flex-col items-center gap-0.5 py-2 px-1 transition-all min-w-[52px] relative ${active?activeTab:inactiveTab}`}>
              {active&&<span className="absolute top-0 left-1/2 -translate-x-1/2 w-5 h-0.5 bg-orange-500 rounded-full"/>}
              <Icon className="w-5 h-5"/>
              <span className="text-[9px] font-medium whitespace-nowrap">{label}</span>
            </button>);
          })}
        </div>
      </nav>
    </div>
  </ThemeCtx.Provider>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
