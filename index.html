<script>
  /* IndexedDB */
  function openDB(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('satsflow',1);
      r.onupgradeneeded=e=>{const db=e.target.result;
        if(!db.objectStoreNames.contains('alerts'))db.createObjectStore('alerts',{keyPath:'id'});
        if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});};
      r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);
    });
  }
  window.dbHelpers={
    async saveAlerts(a){try{const db=await openDB();const tx=db.transaction('alerts','readwrite');const s=tx.objectStore('alerts');s.clear();for(const x of a)s.put(x);return new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j;});}catch(e){console.warn(e);}},
    async loadAlerts(){try{const db=await openDB();const tx=db.transaction('alerts','readonly');return new Promise(r=>{const q=tx.objectStore('alerts').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}catch{return[];}}
  };
  /* SW */
  if('serviceWorker' in navigator){
    window.addEventListener('load',async()=>{
      try{
        const reg=await navigator.serviceWorker.register('/sw.js');
        console.log('[PWA] SW:',reg.scope);
        if('periodicSync' in reg){
          try{const p=await navigator.permissions.query({name:'periodic-background-sync'});
            if(p.state==='granted')await reg.periodicSync.register('price-check',{minInterval:15*60*1000});}
          catch(e){console.log('[PWA] periodicSync:',e.message);}
        }
      }catch(e){console.warn('[PWA]',e.message);}
    });
  }
</script>

<script type="text/babel" data-type="module">
import React,{useState,useEffect,useCallback,useRef,useMemo}from'react';
import ReactDOM from'react-dom/client';
import{RefreshCw,ArrowRightLeft,TrendingUp,Bell,BellPlus,Trash2,AlertTriangle,
  Bitcoin,Download,X,Zap,Activity,Info,ChevronUp,ChevronDown,CheckCircle,
  Newspaper,BarChart2,Cpu,Globe,ExternalLink,Home,CandlestickChart}from'lucide-react';
import{AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,
  ComposedChart,Bar,Cell}from'recharts';

/* ══════════════════════════════════════════════════════════════
   APIS
══════════════════════════════════════════════════════════════ */
const GKO='https://api.coingecko.com/api/v3';
const MEM='https://mempool.space/api';

const fetchBitcoinData=async(days='7')=>{
  try{
    const[pr,hr]=await Promise.all([
      fetch(`${GKO}/simple/price?ids=bitcoin&vs_currencies=usd,eur&include_24hr_change=true&include_market_cap=true`),
      fetch(`${GKO}/coins/bitcoin/market_chart?vs_currency=usd&days=${days}`)
    ]);
    const pj=await pr.json(),hj=await hr.json();
    const history=hj.prices.map(([ts,price])=>{
      const d=new Date(ts);
      const label=days==='1'?d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):
        days==='7'||days==='30'?d.toLocaleDateString('es-ES',{month:'numeric',day:'numeric'}):
        d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
      return{date:label,fullDate:d.toLocaleString(),price};
    });
    return{current_price:{usd:pj.bitcoin.usd,eur:pj.bitcoin.eur},
      change24h:pj.bitcoin.usd_24h_change||0,
      marketCap:pj.bitcoin.usd_market_cap||0,history};
  }catch{return{current_price:{usd:0,eur:0},change24h:0,marketCap:0,history:[]};}
};

const fetchOHLC=async(days='7')=>{
  try{
    const r=await fetch(`${GKO}/coins/bitcoin/ohlc?vs_currency=usd&days=${days}`);
    const j=await r.json();
    return j.map(([ts,o,h,l,c])=>{
      const d=new Date(ts);
      return{ts,date:d.toLocaleDateString('es-ES',{month:'numeric',day:'numeric'}),
        fullDate:d.toLocaleString(),open:o,high:h,low:l,close:c};
    });
  }catch{return[];}
};

const fetchMempoolData=async()=>{
  try{
    const[fr,sr,br]=await Promise.all([
      fetch(`${MEM}/v1/fees/recommended`),
      fetch(`${MEM}/mempool`),
      fetch(`${MEM}/v1/blocks`)
    ]);
    const fees=await fr.json(),stats=await sr.json(),blocks=await br.json();
    const txCount=stats.count||0,last=blocks[0]||{},height=last.height||0;
    const next=Math.ceil(height/210000)*210000;
    return{
      fees:{fastest:fees.fastestFee||0,halfHour:fees.halfHourFee||0,
        hour:fees.hourFee||0,economy:fees.economyFee||0,minimum:fees.minimumFee||1},
      mempool:{txCount,vsize:Math.round((stats.vsize||0)/1e6),
        congestion:Math.min(100,Math.round((txCount/150000)*100))},
      network:{height,nextHalving:next,blocksToHalving:next-height}
    };
  }catch{return null;}
};

const fetchMarketData=async()=>{
  try{
    const[fgRes,globalRes]=await Promise.all([
      fetch('https://api.alternative.me/fng/'),
      fetch(`${GKO}/global`)
    ]);
    const fg=await fgRes.json(),gl=await globalRes.json();
    const fng=fg.data?.[0];
    const btcDom=gl.data?.market_cap_percentage?.btc||0;
    const ethDom=gl.data?.market_cap_percentage?.eth||0;
    const totalMcap=gl.data?.total_market_cap?.usd||0;
    return{
      fearGreed:{value:parseInt(fng?.value||50),label:fng?.value_classification||'Neutral'},
      dominance:{btc:btcDom.toFixed(1),eth:ethDom.toFixed(1),others:(100-btcDom-ethDom).toFixed(1)},
      totalMarketCap:totalMcap
    };
  }catch{return null;}
};

const fetchMiningData=async()=>{
  try{
    // Blockchain.info for hashrate & difficulty
    const[hrRes,diffRes]=await Promise.all([
      fetch('https://blockchain.info/q/hashrate'),
      fetch('https://blockchain.info/q/getdifficulty')
    ]);
    const hashrate=await hrRes.json(); // GH/s
    const difficulty=await diffRes.json();
    // Next difficulty adjustment via mempool
    const adjRes=await fetch(`${MEM}/v1/difficulty-adjustment`);
    const adj=await adjRes.json();
    return{
      hashrate:(hashrate/1e9).toFixed(2), // EH/s
      difficulty:(difficulty/1e12).toFixed(2), // T
      progressPercent:adj.progressPercent||0,
      estimatedRetargetDate:adj.estimatedRetargetDate||null,
      remainingBlocks:adj.remainingBlocks||0,
      difficultyChange:adj.difficultyChange||0
    };
  }catch{return null;}
};

const fetchNews=async()=>{
  try{
    // CryptoPanic public feed (no API key needed for public)
    const r=await fetch('https://cryptopanic.com/api/v1/posts/?auth_token=free&currencies=BTC&public=true&kind=news&filter=rising');
    const j=await r.json();
    return(j.results||[]).slice(0,12).map(n=>({
      id:n.id,title:n.title,url:n.url,
      source:n.source?.title||'Crypto',
      publishedAt:new Date(n.published_at),
      votes:n.votes?.positive||0,
      panic:n.votes?.negative||0
    }));
  }catch{
    // Fallback: RSS via rss2json (no key needed)
    try{
      const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://feeds.feedburner.com/CoinDesk');
      const j=await r.json();
      return(j.items||[]).slice(0,12).map(n=>({
        id:n.guid,title:n.title,url:n.link,
        source:'CoinDesk',publishedAt:new Date(n.pubDate),votes:0,panic:0
      }));
    }catch{return[];}
  }
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════════ */
const showNotif=(title,body)=>{
  if(Notification.permission!=='granted')return;
  const opts={body,icon:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/192px-Bitcoin.svg.png',
    badge:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/96px-Bitcoin.svg.png',
    vibrate:[300,100,300],tag:'satsflow-alert',renotify:true};
  if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,opts));
  else new Notification(title,opts);
};
const fmtNum=(v,d=2)=>isNaN(v)?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const fmtBig=(v)=>{
  if(!v||isNaN(v))return'—';
  if(v>=1e12)return`$${(v/1e12).toFixed(2)}T`;
  if(v>=1e9)return`$${(v/1e9).toFixed(1)}B`;
  if(v>=1e6)return`$${(v/1e6).toFixed(1)}M`;
  return`$${v.toLocaleString()}`;
};
const timeAgo=(date)=>{
  const s=Math.floor((Date.now()-date.getTime())/1000);
  if(s<60)return`${s}s`;if(s<3600)return`${Math.floor(s/60)}m`;
  if(s<86400)return`${Math.floor(s/3600)}h`;return`${Math.floor(s/86400)}d`;
};

/* ══════════════════════════════════════════════════════════════
   INSTALL PROMPT
══════════════════════════════════════════════════════════════ */
const InstallPrompt=()=>{
  const[prompt,setPrompt]=useState(null);
  const[modal,setModal]=useState(false);
  const[installed,setInstalled]=useState(false);
  useEffect(()=>{
    if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){setInstalled(true);return;}
    const h=e=>{e.preventDefault();setPrompt(e);};
    window.addEventListener('beforeinstallprompt',h);
    return()=>window.removeEventListener('beforeinstallprompt',h);
  },[]);
  if(installed)return null;
  const handle=async()=>{if(prompt){prompt.prompt();await prompt.userChoice;setPrompt(null);}else setModal(true);};
  return(<>
    <button onClick={handle} className="p-2 bg-slate-800 text-slate-300 hover:text-white rounded-lg border border-slate-700 hover:bg-slate-700 transition-colors flex items-center gap-1.5 text-sm font-medium">
      <Download className="w-4 h-4"/><span className="hidden sm:inline">Instalar</span>
    </button>
    {modal&&(<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl relative">
        <button onClick={()=>setModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><X className="w-5 h-5"/></button>
        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Download className="w-5 h-5 text-orange-500"/>Instalar SatsFlow</h3>
        <div className="space-y-3 text-sm">
          {['Pulsa el menú del navegador (⋮ o compartir).','Selecciona "Instalar aplicación" o "Añadir a pantalla de inicio".','La app funcionará con notificaciones aunque esté cerrada.'].map((t,i)=>(
            <div key={i} className="bg-slate-800 p-3 rounded-lg flex gap-3">
              <span className="w-6 h-6 rounded-full bg-orange-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">{i+1}</span>
              <p className="text-slate-300">{t}</p>
            </div>
          ))}
        </div>
        <button onClick={()=>setModal(false)} className="mt-5 w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-lg transition-colors">Entendido</button>
      </div>
    </div>)}
  </>);
};

/* ══════════════════════════════════════════════════════════════
   CONVERTER
══════════════════════════════════════════════════════════════ */
const Converter=({btcPriceUsd,btcPriceEur})=>{
  const[btc,setBtc]=useState('1');
  const[sats,setSats]=useState('100000000');
  const[usd,setUsd]=useState('');
  const[eur,setEur]=useState('');
  useEffect(()=>{if(btcPriceUsd>0&&btc)calc('btc',btc,btcPriceUsd,btcPriceEur);},[btcPriceUsd,btcPriceEur]);
  function calc(f,raw,pU=btcPriceUsd,pE=btcPriceEur){
    const v=parseFloat(raw),ok=!isNaN(v)&&v>=0;
    if(f==='btc'){setBtc(raw);ok?(setSats((v*1e8).toFixed(0)),setUsd((v*pU).toFixed(2)),setEur((v*pE).toFixed(2))):(setSats(''),setUsd(''),setEur(''));}
    if(f==='sats'){setSats(raw);if(ok){const b=v/1e8;setBtc(b.toFixed(8).replace(/\.?0+$/,''));setUsd((b*pU).toFixed(2));setEur((b*pE).toFixed(2));}else{setBtc('');setUsd('');setEur('');}}
    if(f==='usd'){setUsd(raw);if(ok&&pU){const b=v/pU;setBtc(b.toFixed(8));setSats((b*1e8).toFixed(0));setEur((b*pE).toFixed(2));}else{setBtc('');setSats('');setEur('');}}
    if(f==='eur'){setEur(raw);if(ok&&pE){const b=v/pE;setBtc(b.toFixed(8));setSats((b*1e8).toFixed(0));setUsd((b*pU).toFixed(2));}else{setBtc('');setSats('');setUsd('');}}
  }
  const fields=[
    {id:'btc',label:'Bitcoin (BTC)',icon:'₿',color:'orange',val:btc},
    {id:'sats',label:'Satoshis',icon:'⚡',color:'yellow',val:sats},
    {id:'usd',label:'Dólar (USD)',icon:'$',color:'green',val:usd},
    {id:'eur',label:'Euro (EUR)',icon:'€',color:'blue',val:eur},
  ];
  return(<div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
    <h2 className="text-lg font-semibold text-white flex items-center gap-2 mb-4"><ArrowRightLeft className="w-5 h-5 text-orange-500"/>Conversor</h2>
    <div className="grid grid-cols-2 gap-3">
      {fields.map(({id,label,icon,color,val})=>(<div key={id}>
        <label className="block text-xs font-medium text-slate-400 mb-1">{label}</label>
        <div className="relative">
          <input type="number" value={val} onChange={e=>calc(id,e.target.value)}
            className={`w-full bg-slate-900 text-white rounded-lg p-2.5 pl-8 border border-slate-700 focus:border-${color}-500 outline-none transition-all text-sm`}
            placeholder="0"/>
          <span className={`absolute left-2.5 top-2.5 text-${color}-500 font-bold text-sm`}>{icon}</span>
        </div>
      </div>))}
    </div>
    <p className="mt-3 text-xs text-slate-500 text-center">1 BTC ≈ ${fmtNum(btcPriceUsd)} / €{fmtNum(btcPriceEur)}</p>
  </div>);
};

/* ══════════════════════════════════════════════════════════════
   PRICE CHART (Area + Candlestick toggle)
══════════════════════════════════════════════════════════════ */
const CandleChart=({data})=>{
  if(!data.length)return null;
  const prices=data.flatMap(d=>[d.high,d.low]);
  const minP=Math.min(...prices),maxP=Math.max(...prices);
  const range=maxP-minP||1;
  const W=600,H=220,PAD=8,LEFT=52,BOT=24;
  const cW=Math.max(4,Math.floor((W-LEFT-PAD)/(data.length))-2);
  const toY=v=>PAD+(1-(v-minP)/range)*(H-PAD-BOT);
  const toX=(i)=>LEFT+(i+0.5)*((W-LEFT-PAD)/data.length);
  // Show every Nth label
  const step=Math.ceil(data.length/6);
  return(<div className="w-full overflow-x-auto">
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{minWidth:'300px'}}>
      {/* Grid */}
      {[0,0.25,0.5,0.75,1].map(t=>{
        const y=PAD+t*(H-PAD-BOT);
        const val=maxP-t*range;
        return(<g key={t}>
          <line x1={LEFT} y1={y} x2={W-PAD} y2={y} stroke="#334155" strokeDasharray="3 3"/>
          <text x={LEFT-4} y={y+4} textAnchor="end" fill="#94a3b8" fontSize="9">${(val/1000).toFixed(0)}k</text>
        </g>);
      })}
      {/* Candles */}
      {data.map((d,i)=>{
        const up=d.close>=d.open;
        const x=toX(i);
        const yH=toY(d.high),yL=toY(d.low);
        const yO=toY(d.open),yC=toY(d.close);
        const bodyTop=Math.min(yO,yC),bodyH=Math.max(1,Math.abs(yO-yC));
        return(<g key={d.ts} className={up?'candle-up':'candle-down'}>
          <line x1={x} y1={yH} x2={x} y2={yL} strokeWidth="1" className="wick"/>
          <rect x={x-cW/2} y={bodyTop} width={cW} height={bodyH} rx="1"/>
          {i%step===0&&<text x={x} y={H-4} textAnchor="middle" fill="#64748b" fontSize="8">{d.date}</text>}
        </g>);
      })}
    </svg>
  </div>);
};

const PriceChart=({data,ohlc,selectedDays,onDaysChange,loading})=>{
  const[chartType,setChartType]=useState('area');
  if(!data?.length)return(<div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 h-[300px] flex items-center justify-center text-slate-500">
    <span className="flex items-center gap-2"><RefreshCw className="w-4 h-4 animate-spin"/>Cargando...</span>
  </div>);
  const last=data[data.length-1]?.price||0,first=data[0]?.price||0;
  const pos=last>=first,color=pos?'#10b981':'#ef4444';
  const pct=first?((last-first)/first*100).toFixed(2):'0.00';
  const periods=[{label:'24h',value:'1'},{label:'7D',value:'7'},{label:'30D',value:'30'},{label:'90D',value:'90'},{label:'1A',value:'365'}];
  return(<div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-3">
      <div>
        <h2 className="text-lg font-semibold text-white flex items-center gap-2"><TrendingUp className="w-5 h-5 text-orange-500"/>Historial</h2>
        <span className={`mt-1 inline-block text-sm font-medium px-2 py-0.5 rounded ${pos?'bg-emerald-500/10 text-emerald-400':'bg-red-500/10 text-red-400'}`}>
          {pos?'+':''}{pct}% <span className="text-slate-500 text-xs ml-1">en este periodo</span>
        </span>
      </div>
      <div className="flex flex-col items-end gap-2 w-full sm:w-auto">
        <div className="flex gap-1">
          <button onClick={()=>setChartType('area')} className={`px-2.5 py-1 text-xs rounded-md transition-all ${chartType==='area'?'bg-orange-500 text-white':'bg-slate-700 text-slate-400 hover:text-white'}`}>Área</button>
          <button onClick={()=>setChartType('candle')} className={`px-2.5 py-1 text-xs rounded-md transition-all flex items-center gap-1 ${chartType==='candle'?'bg-orange-500 text-white':'bg-slate-700 text-slate-400 hover:text-white'}`}>
            <span>Velas</span>
          </button>
        </div>
        <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 w-full sm:w-auto">
          {periods.map(p=>(<button key={p.value} onClick={()=>onDaysChange(p.value)} disabled={loading}
            className={`px-2.5 py-1.5 text-xs font-medium rounded-md transition-all flex-1 sm:flex-none ${selectedDays===p.value?'bg-slate-700 text-white':'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
            {p.label}
          </button>))}
        </div>
      </div>
    </div>
    <div className="h-[220px] relative">
      {loading&&<div className="absolute inset-0 bg-slate-800/70 z-10 flex items-center justify-center rounded-lg backdrop-blur-sm"><RefreshCw className="w-8 h-8 text-orange-500 animate-spin"/></div>}
      {chartType==='area'?(<ResponsiveContainer width="100%" height="100%">
        <AreaChart data={data}>
          <defs><linearGradient id="gP" x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={color} stopOpacity={0.3}/><stop offset="95%" stopColor={color} stopOpacity={0}/>
          </linearGradient></defs>
          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155"/>

const FearGreedGauge=({value,label})=>{
  const color=value<=25?'#ef4444':value<=45?'#f97316':value<=55?'#eab308':value<=75?'#84cc16':'#10b981';
  const labelEs=value<=25?'Miedo extremo':value<=45?'Miedo':value<=55?'Neutral':value<=75?'Codicia':'Codicia extrema';
  const angle=-90+(value/100)*180;
  const r=70,cx=90,cy=90;
  const toRad=deg=>(deg*Math.PI)/180;
  const x=cx+r*Math.cos(toRad(angle)),y=cy+r*Math.sin(toRad(angle));
  // Arc background segments
  const segments=[{color:'#ef4444',start:-90,end:-54},{color:'#f97316',start:-54,end:-18},
    {color:'#eab308',start:-18,end:18},{color:'#84cc16',start:18,end:54},{color:'#10b981',start:54,end:90}];
  const arcPath=(s,e)=>{
    const x1=cx+r*Math.cos(toRad(s)),y1=cy+r*Math.sin(toRad(s));
    const x2=cx+r*Math.cos(toRad(e)),y2=cy+r*Math.sin(toRad(e));
    return`M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`;
  };
  return(<div className="flex flex-col items-center">
    <svg viewBox="0 0 180 100" className="w-full max-w-[180px]">
      {segments.map((s,i)=><path key={i} d={arcPath(s.start,s.end)} stroke={s.color} strokeWidth="14" fill="none" strokeLinecap="round" opacity="0.5"/>)}
      <line x1={cx} y1={cy} x2={x} y2={y} stroke={color} strokeWidth="3" strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r="4" fill={color}/>
      <text x={cx} y={cy-16} textAnchor="middle" fill="white" fontSize="20" fontWeight="800">{value}</text>
      <text x={cx} y={cy-4} textAnchor="middle" fill={color} fontSize="9" fontWeight="600">{labelEs}</text>
    </svg>
  </div>);
};

/* ══════════════════════════════════════════════════════════════
   ALERTS
══════════════════════════════════════════════════════════════ */
const AlertsPanel=({currentPriceUsd,currentPriceEur})=>{
  const[alerts,setAlerts]=useState([]);
  const[target,setTarget]=useState('');
  const[currency,setCurrency]=useState('usd');
  const[notifPerm,setNotifPerm]=useState('default');
  const[notifMsg,setNotifMsg]=useState('');
  useEffect(()=>{
    window.dbHelpers?.loadAlerts().then(s=>{if(s.length)setAlerts(s);});
    setNotifPerm(window.Notification?.permission||'unsupported');
  },[]);
  useEffect(()=>{
    if(!alerts.length)return;
    window.dbHelpers?.saveAlerts(alerts);
    navigator.serviceWorker?.ready.then(reg=>reg.active?.postMessage({type:'CHECK_ALERTS',alerts}));
  },[alerts]);
  useEffect(()=>{
    if(!currentPriceUsd)return;
    let changed=false;
    const updated=alerts.map(a=>{
      if(a.triggered)return a;
      const p=a.currency==='usd'?currentPriceUsd:currentPriceEur;
      const hit=a.condition==='above'?p>=a.targetPrice:p<=a.targetPrice;
      if(hit){const sym=a.currency==='usd'?'$':'€';showNotif('⚡ Alerta SatsFlow',`BTC ha ${a.condition==='above'?'subido sobre':'bajado de'} ${sym}${a.targetPrice.toLocaleString()} — $${currentPriceUsd.toLocaleString()}`);changed=true;return{...a,triggered:true};}
      return a;
    });
    if(changed)setAlerts(updated);
  },[currentPriceUsd,currentPriceEur]);
  const activateNotifs=async()=>{const r=await(window.Notification?Notification.requestPermission():Promise.resolve('unsupported'));setNotifPerm(r);setNotifMsg(r==='granted'?'✅ Notificaciones activadas':r==='denied'?'❌ Permiso denegado. Actívalas en Ajustes.':'');};
  const addAlert=()=>{const val=parseFloat(target);if(isNaN(val)||val<=0)return;const price=currency==='usd'?currentPriceUsd:currentPriceEur;setAlerts(prev=>[...prev,{id:Date.now().toString(),targetPrice:val,currency,condition:val>price?'above':'below',triggered:false}]);setTarget('');};
  return(<div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col">
    <h2 className="text-lg font-semibold text-white flex items-center gap-2 mb-4"><Bell className="w-5 h-5 text-orange-500"/>Alertas de precio</h2>
    {'Notification' in window&&notifPerm!=='granted'&&(<div className="mb-4 bg-orange-500/10 border border-orange-500/30 rounded-xl p-3 flex items-start gap-3">
      <Bell className="w-4 h-4 text-orange-400 mt-0.5 flex-shrink-0"/>
      <div className="flex-1"><p className="text-xs text-orange-300 font-medium">Activa las notificaciones</p><p className="text-xs text-slate-400 mt-0.5">Para recibir alertas con la app cerrada.</p>{notifMsg&&<p className="text-xs mt-1">{notifMsg}</p>}</div>
      <button onClick={activateNotifs} className="bg-orange-500 hover:bg-orange-600 text-white text-xs px-3 py-1.5 rounded-lg transition-colors flex-shrink-0">Activar</button>
    </div>)}
    {notifPerm==='granted'&&(<div className="mb-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 flex items-center gap-2">
      <CheckCircle className="w-4 h-4 text-emerald-400 flex-shrink-0"/>
      <p className="text-xs text-emerald-300">Notificaciones activas. Recibirás avisos aunque la app esté cerrada.</p>
    </div>)}
    <div className="flex gap-2 mb-4">
      <div className="relative flex-1">
        <span className="absolute left-2.5 top-2.5 text-slate-500 text-sm">{currency==='usd'?'$':'€'}</span>
        <input type="number" value={target} onChange={e=>setTarget(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addAlert()}
          className="w-full bg-slate-900 text-white rounded-lg py-2 pl-6 pr-2 border border-slate-700 focus:border-orange-500 outline-none text-sm" placeholder="Precio objetivo"/>
      </div>
      <select value={currency} onChange={e=>setCurrency(e.target.value)} className="bg-slate-900 text-white rounded-lg px-2 border border-slate-700 outline-none text-sm">
        <option value="usd">USD</option><option value="eur">EUR</option>
      </select>
      <button onClick={addAlert} className="bg-orange-500 hover:bg-orange-600 text-white p-2 rounded-lg transition-colors flex-shrink-0"><BellPlus className="w-5 h-5"/></button>
    </div>
    <div className="space-y-2 overflow-y-auto max-h-80">
      {alerts.length===0?(<p className="text-center text-slate-500 text-sm py-8">Sin alertas activas.<br/>Introduce un precio y pulsa +.</p>):alerts.map(a=>(
        <div key={a.id} className={`flex items-center justify-between p-3 rounded-xl border ${a.triggered?'bg-yellow-500/10 border-yellow-500/40':'bg-slate-700/40 border-slate-600/60'}`}>
          <div className="flex items-center gap-3 min-w-0">
            {a.triggered?<AlertTriangle className="w-5 h-5 text-yellow-500 animate-pulse flex-shrink-0"/>:<div className={`w-2 h-2 rounded-full flex-shrink-0 ${a.condition==='above'?'bg-green-500':'bg-red-500'}`}/>}
            <div><p className="text-sm font-medium text-white">{a.condition==='above'?'↑':'↓'} {a.currency==='usd'?'$':'€'}{a.targetPrice.toLocaleString()}</p>
              <p className="text-xs text-slate-400">{a.triggered?'¡DISPARADA!':'Pendiente'}</p></div>
          </div>
          <button onClick={()=>setAlerts(prev=>prev.filter(x=>x.id!==a.id))} className="text-slate-500 hover:text-red-400 p-1 flex-shrink-0"><Trash2 className="w-4 h-4"/></button>
        </div>
      ))}
    </div>
  </div>);
};

const App=()=>{
  const[tab,setTab]=useState('home');
  const[data,setData]=useState({current_price:{usd:0,eur:0},change24h:0,marketCap:0,history:[]});
  const[ohlc,setOhlc]=useState([]);
  const[mempool,setMempool]=useState(null);
  const[marketData,setMarketData]=useState(null);
  const[miningData,setMiningData]=useState(null);
  const[news,setNews]=useState([]);
  const[days,setDays]=useState('7');
  const[lChart,setLC]=useState(false);
  const[lMem,setLM]=useState(true);
  const[lMarket,setLMkt]=useState(true);
  const[lNews,setLNews]=useState(true);
  const[lastUpd,setLU]=useState(null);

  const loadPrice=useCallback(async(d=days)=>{
    if(d!==days)setLC(true);
    const[nd,oh]=await Promise.all([fetchBitcoinData(d),fetchOHLC(d)]);
    setData(nd);setOhlc(oh);setLC(false);setLU(new Date());
  },[days]);
  const loadMempool=useCallback(async()=>{setLM(true);setMempool(await fetchMempoolData());setLM(false);},[]);
  const loadMarket=useCallback(async()=>{setLMkt(true);const[md,mi]=await Promise.all([fetchMarketData(),fetchMiningData()]);setMarketData(md);setMiningData(mi);setLMkt(false);},[]);
  const loadNews=useCallback(async()=>{setLNews(true);setNews(await fetchNews());setLNews(false);},[]);

  useEffect(()=>{
    loadPrice();loadMempool();loadMarket();loadNews();
    const pi=setInterval(()=>loadPrice(days),60000);
    const mi=setInterval(loadMempool,30000);
    const mki=setInterval(loadMarket,120000);
    const ni=setInterval(loadNews,300000);
    return()=>{clearInterval(pi);clearInterval(mi);clearInterval(mki);clearInterval(ni);};
  },[days]);

  const ch=data.change24h||0,pos=ch>=0;

  return(<div className="min-h-screen bg-slate-950 flex flex-col">
    {/* Header */}
    <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-3">
      <div className="max-w-5xl mx-auto flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center shadow-md shadow-orange-500/30">
            <Bitcoin className="w-5 h-5 text-white"/>
          </div>
          <div>
            <h1 className="text-lg font-bold text-white leading-none">SatsFlow</h1>
            <p className="text-slate-500 text-[10px]">Bitcoin Tracker</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <div className="text-right">
            <p className="text-base font-mono font-bold text-white">${data.current_price.usd.toLocaleString()}</p>
            {ch!==0&&<p className={`text-xs flex items-center justify-end gap-0.5 ${pos?'text-emerald-400':'text-red-400'}`}>
              {pos?<ChevronUp className="w-3 h-3"/>:<ChevronDown className="w-3 h-3"/>}{Math.abs(ch).toFixed(2)}%
            </p>}
          </div>
          <InstallPrompt/>
        </div>
      </div>
    </header>

    {/* Content */}
    <main className="flex-1 px-4 py-5 pb-24 overflow-y-auto">
      <div className="max-w-5xl mx-auto">

        {tab==='home'&&(<div className="space-y-5 animate-fadeIn">
          <Converter btcPriceUsd={data.current_price.usd} btcPriceEur={data.current_price.eur}/>
          <PriceChart data={data.history} ohlc={ohlc} selectedDays={days} onDaysChange={d=>{setDays(d);loadPrice(d);}} loading={lChart}/>
          {/* Quick stats */}
          <div className="grid grid-cols-3 gap-3">
            {[
              {label:'Cap. de mercado',val:fmtBig(data.marketCap),color:'text-blue-400'},
              {label:'Cambio 24h',val:`${pos?'+':''}${ch.toFixed(2)}%`,color:pos?'text-emerald-400':'text-red-400'},
              {label:'Última act.',val:lastUpd?lastUpd.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—',color:'text-slate-400'},
            ].map(({label,val,color})=>(<div key={label} className="bg-slate-800 rounded-xl p-3 border border-slate-700 text-center">
              <p className="text-[10px] text-slate-500 uppercase tracking-wide">{label}</p>
              <p className={`text-sm font-bold mt-0.5 ${color}`}>{val}</p>
            </div>))}
          </div>
          <p className="text-xs text-slate-600 text-center">Precios: CoinGecko · Mempool: mempool.space · No es un consejo financiero.</p>
        </div>)}

        {tab==='market'&&(<div className="animate-fadeIn"><MarketPanel marketData={marketData} miningData={miningData} btcMarketCap={data.marketCap} loading={lMarket}/></div>)}

        {tab==='mempool'&&(<div className="animate-fadeIn"><MempoolPanel btcPriceUsd={data.current_price.usd} mempoolData={mempool} loading={lMem} onRefresh={loadMempool}/></div>)}

        {tab==='news'&&(<div className="animate-fadeIn"><NewsPanel news={news} loading={lNews} onRefresh={loadNews}/></div>)}

        {tab==='alerts'&&(<div className="animate-fadeIn"><AlertsPanel currentPriceUsd={data.current_price.usd} currentPriceEur={data.current_price.eur}/></div>)}

      </div>
    </main>

    {/* Bottom Tab Bar */}
    <nav className="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur border-t border-slate-800 safe-area-bottom">
      <div className="max-w-5xl mx-auto flex">
        {TABS.map(({id,label,icon:Icon})=>{
          const active=tab===id;
          return(<button key={id} onClick={()=>setTab(id)}
            className={`flex-1 flex flex-col items-center gap-1 py-2.5 transition-all ${active?'text-orange-500':'text-slate-500 hover:text-slate-300'}`}>
            <Icon className={`w-5 h-5 ${active?'drop-shadow-[0_0_6px_rgba(249,115,22,0.7)]':''}`}/>
            <span className="text-[10px] font-medium">{label}</span>
            {active&&<span className="absolute top-0 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-orange-500 rounded-full"/>}
          </button>);
        })}
      </div>
    </nav>
  </div>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
